# Circuit Breaker
# Reduce open-state wait from 30s to 5s so CircuitBreakerIntegrationTest
# completes in ~15s instead of ~45s. Only affects the test Spring context.
resilience4j.circuitbreaker.instances.redisLock.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.redisLock.sliding-window-size=5
resilience4j.circuitbreaker.instances.redisLock.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.redisLock.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.redisLock.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.redisCache.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.redisCache.sliding-window-size=5
resilience4j.circuitbreaker.instances.redisCache.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.redisCache.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.redisCache.automatic-transition-from-open-to-half-open-enabled=true

# Kafka
# Guarantee test consumers always read from the beginning of a topic.
# Since Testcontainers Kafka starts fresh each test run, consumers might
# start polling before the producer fires, earliest ensures no message is missed.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.consumer.properties.session.timeout.ms=30000
spring.kafka.consumer.properties.heartbeat.interval.ms=10000
spring.kafka.listener.immediate-stop=true

# Logging
# Application code at DEBUG so failing tests show exactly what happened
logging.level.com.ShikharKothari0.SeatLock=DEBUG

# SQL at DEBUG to count queries during stampede test
# Change to WARN if you want to suppress SQL output during normal test runs
logging.level.org.hibernate.SQL=DEBUG

# Suppress noisy framework output that drowns test logs
logging.level.org.springframework.kafka=WARN
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN
logging.level.com.zaxxer.hikari=WARN

# HikariCP connection pool settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

seatlock.ratelimit.hold.max-requests=5
seatlock.ratelimit.hold.window-seconds=10
