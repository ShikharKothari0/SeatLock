api.version=1.44

# this is file to forces the old client to speak an API version Docker 29 accepts.
# The current SpringBoot version 3.5.6 is not compatible with testcontainers 2.x.
#So when Docker  raises the minimum API version past 1.44 & we have upgraded to SpringBoot 4, we can remove this file and the testcontainers version can be upgraded to 2.x