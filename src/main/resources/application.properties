spring.application.name=SeatLock
spring.datasource.url=jdbc:postgresql://localhost:5432/seatlock
spring.datasource.username=admin
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=validate

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=seatlock-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# separate consumer group configs
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ShikharKothari0.SeatLock.kafka.event
spring.kafka.listener.concurrency=3
spring.kafka.listener.ack-mode=RECORD