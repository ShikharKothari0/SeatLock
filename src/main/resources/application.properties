spring.application.name=SeatLock
spring.datasource.url=jdbc:postgresql://localhost:5432/seatlock
spring.datasource.username=admin
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=validate

spring.data.redis.host=localhost
spring.data.redis.port=6379

logging.level.com.ShikharKothari0.SeatLock.service=DEBUG

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=seatlock-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# separate consumer group configs
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ShikharKothari0.SeatLock.kafka.event
spring.kafka.listener.concurrency=3
spring.kafka.listener.ack-mode=RECORD

# Resilience4j circuit breaker: redis-lock
resilience4j.circuitbreaker.instances.redisLock.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.redisLock.sliding-window-size=10
resilience4j.circuitbreaker.instances.redisLock.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redisLock.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.redisLock.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.redisLock.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.redisLock.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.redisLock.register-health-indicator=true

# expose circuit breaker state via Actuator
management.endpoints.web.exposure.include=health, info, prometheus, circuitbreakers, circuitbreakerevents, metrics
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=SeatLock

# Resilience4j circuit breaker: redisCache
resilience4j.circuitbreaker.instances.redisCache.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.redisCache.sliding-window-size=10
resilience4j.circuitbreaker.instances.redisCache.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redisCache.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.redisCache.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.redisCache.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.redisCache.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.redisCache.register-health-indicator=true
resilience4j.circuitbreaker.instances.redisCache.record-exceptions=org.springframework.data.redis.RedisConnectionFailureException,org.springframework.dao.QueryTimeoutException,io.lettuce.core.RedisConnectionException

# Rate limiting: seat hold endpoint
seatlock.ratelimit.hold.max-requests=5
seatlock.ratelimit.hold.window-seconds=10

# HikariCP connection pool tuning
# Default is 10. Under 1,000 concurrent virtual users, 10 connections means
# 990 threads are queuing. Increasing to 50 dramatically reduces queue wait.
# Rule of thumb: pool-size = (core_count * 2) + effective_disk_spindles.
# On a 4-core dev machine this gives ~10, but load testing is artificial
# a higher pool size is justified here to prove the performance ceiling.
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Lettuce connection pool tuning
# Default: single shared connection (all threads serialize through one socket).
# Under 900 req/s this creates severe queueing. Connection pooling gives each
# thread its own connection, eliminating the serialization bottleneck.
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=5000ms
logging.level.io.lettuce.core.pool=DEBUG

# JVM tuning
# GC pauses show up directly in p99 latency ? a 200ms GC pause adds 200ms
# to every request that was in-flight during the pause.
# G1GC is Spring Boot's default for Java 17+. These flags tune its behavior
# for a low-latency web workload rather than throughput.
# Add to your run command: java -XX:+UseG1GC -XX:MaxGCPauseMillis=100
# Or set in application.properties (Spring Boot passes these to the JVM):
# reduces startup overhead, not GC-related but free performance win
spring.jmx.enabled=false

# Frontend integration
seatlock.frontend.url=http://localhost:5173

# SSE async timeout (5 minutes)
spring.mvc.async.request-timeout=300000
