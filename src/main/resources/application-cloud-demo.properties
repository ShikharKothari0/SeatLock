# Enable alongside deployment: SPRING_PROFILES_ACTIVE=deployment,cloud-demo
server.port=${PORT:8080}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.data.redis.ssl.enabled=true
spring.data.redis.lettuce.pool.max-active=4
spring.data.redis.lettuce.pool.max-idle=2
spring.data.redis.lettuce.pool.min-idle=0
spring.kafka.listener.concurrency=1
# Create the five two-partition topics in Aiven's console before starting.
seatlock.kafka.manage-topics=false
seatlock.kafka.partitions=2
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=${KAFKA_JAAS_CONFIG}
# PEM CA contents, supplied as a secret environment variable; never disable verification.
spring.kafka.properties.ssl.truststore.type=PEM
spring.kafka.properties.ssl.truststore.certificates=${KAFKA_CA_PEM}
