name: seatlock-deploy
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatlock
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deployment env file}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U admin -d seatlock"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk_data:/var/lib/zookeeper/data
      - zk_log:/var/lib/zookeeper/log
    restart: unless-stopped
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, 'kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: deployment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/seatlock
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SEATLOCK_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      SEATLOCK_COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8088}:80'
      - '${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
volumes:
  database:
  redis:
  kafka:
  zk_data:
  zk_log:
  caddy_data:
  caddy_config:
